name: Deploy research site to cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20 + npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build

      - name: Verify dist exists
        run: |
          test -d dist || (echo "❌ dist/ not found. Check Vite build output." && exit 1)
          echo "✅ dist/ found"

      - name: Verify SPA .htaccess exists
        run: |
          test -f dist/.htaccess || (echo "❌ .htaccess not found in dist/" && exit 1)
          echo "✅ .htaccess present in dist/ (from public/)"

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 60000
          local-dir: dist/
          server-dir: ./