name: Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Docker App to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Connecting to production server..."

            # Navigate to project directory
            PROJECT_DIR="${{ secrets.VPS_PROJECT_DIR || '/opt/siddheshv1' }}"
            echo "📂 Deploying in: $PROJECT_DIR"
            cd "$PROJECT_DIR"

            echo "📥 Fetching latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 Rebuilding and restarting Docker containers..."
            docker compose down || true
            docker compose build --no-cache
            docker compose up -d

            echo "🧹 Cleaning up dangling Docker build cache..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"